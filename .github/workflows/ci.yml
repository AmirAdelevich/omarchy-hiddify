name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: corebridge/go.mod
          cache-dependency-path: corebridge/go.sum
      - run: python -W error::ResourceWarning -m unittest discover -s . -p test_backend.py
      - run: node test.cjs
      - run: go test ./...
        working-directory: corebridge
      - run: bash -n install.sh
